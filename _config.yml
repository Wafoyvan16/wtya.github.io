title: "Yvan WAFO - Ingenieur Cybersecurite"
description: "Portfolio, experiences et writeups CTF de Yvan WAFO"
url: "https://wafoyvan16.github.io"
baseurl: "/wtya.github.io"

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

collections:
  writeups:
    output: true
    permalink: /writeups/:path/

defaults:
  - scope:
      path: ""
      type: "writeups"
    values:
      layout: "writeup"
  - scope:
      path: ""
    values:
      layout: "page"

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
