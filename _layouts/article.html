---
layout: default
---
<article class="writeup">
  <div class="writeup__inner">
    <a class="writeup__back" href="{{ '/articles/' | relative_url }}">&larr; retour aux articles</a>

    <header class="writeup__header">
      <p class="writeup__hop"># article de recherche</p>
      <h1 class="writeup__title">{{ page.title }}</h1>
      <div class="writeup__meta">
        {% if page.status %}<span class="tag tag--{{ page.status | slugify }}">{{ page.status }}</span>{% endif %}
        {% if page.date %}<span class="writeup__date">{{ page.date | date: "%d %b %Y" }}</span>{% endif %}
      </div>
      {% if page.tags %}
      <div class="writeup__tags">
        {% for t in page.tags %}<span class="pill">{{ t }}</span>{% endfor %}
      </div>
      {% endif %}
    </header>

    <div class="writeup__content">
      {{ content }}
    </div>
  </div>
</article>
