- role: "Administrateur cybersecurite"
  company: "ASEI"
  period: "Juin 2026 - present"
  location: "Toulouse, France"
  summary: >
    Dans le cadre du programme CARE Renfort RH Cybersecurite, je contribue au renforcement de la securite du systeme d'information en intervenant sur plusieurs axes strategiques : la resilience et la sauvegarde des donnees,la securisation des acces a distance, ainsi que la protection et la supervision des postes de travail.
  highlights:
    - "Deploiement et generalisation de l'authentification multifacteur (MFA)."
    - "Realisation d'audits et de tests de securite du systeme d'information."
    - "Conception et pilotage de campagnes de sensibilisation au phishing (simulations d'hameconnage)."
    - "Investigations forensiques sur des postes utilisateurs a la suite d'incidents de securite."
    - "Analyse et traitement des rapports de securite issus de differents outils (ORADAD, ORADAZ, SILENE, NETIFUL)."
    - "Elaboration et mise en place d'une strategie de sauvegarde securisee."
    - "Participation au renforcement continu de la posture de cybersecurite."

- role: "Stage - Auditeur en test d'intrusion"
  company: "SAGEMCOM"
  period: "Fevrier 2025 - Juillet 2025"
  location: "Bois-Colombes, France"
  summary: >
    Automatisation des tests d'intrusion au sein du laboratoire de securite, avec de nouveaux tests axes sur la securite des protocoles radio (Wifi,Bluetooth, NFC, Zigbee).
  highlights:
    - "Tests d'intrusion Wi-Fi (WEP/WPA/WPA3) et Bluetooth (Classic & BLE) sur produits IoT."
    - "Analyse et exploitation de vulnerabilites sur protocoles radio."
    - "Integration et automatisation de tests de securite dans l'outil interne test-auto (Python)."
    - "Developpement de PoC pour FragAttack, KRACK et Dragonblood (WPA3)."

- role: "Stage - Ingenieur SecOps"
  company: "Telerys Communication"
  period: "Janvier 2024 - Juillet 2024"
  location: "Courbevoie, France"
  summary: >
    Evolution du systeme d'information de Telerys Communication, adressant les besoins des fonctions de l'entreprise (commerce, deploiement, exploitation,production, finance).
  highlights:
    - "Deploiement et automatisation d'un SIEM ELK et d'un IDS Snort via Ansible."
    - "Creation de dashboards et d'alertes pour la detection de connexions frauduleuses."
    - "Mise en place d'un DNSSEC prive et automatisation de la validation SSHFP."
    - "Securisation des flux reseau (ACLs, bulle d'acces isolee - ufw)."
    - "Utilisation des pratiques X-Ops : deploiement, environnements, versioning, automatisation."
