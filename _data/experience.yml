    - "Investigations forensiques sur des postes utilisateurs à la suite d'incidents de sécurité (ex. : analyse et remédiation d'infections par des infostealers tels qu'Acreed)."
    - "Analyse et traitement des rapports de sécurité issus de différents outils (ORADAD, ORADAZ, SILENE, NETIFUL), avec mise en œuvre des actions de remédiation."
    - "Élaboration et mise en place d'une stratégie de sauvegarde sécurisée afin d'améliorer la résilience du système d'information."
    - "Participation au renforcement continu de la posture de cybersécurité et à la réduction de la surface d'exposition du système d'information."

- role: "Stage - Auditeur en test d'intrusion"
  company: "SAGEMCOM"
  period: "Février 2025 — Juillet 2025"
  location: "Bois-Colombes, France"
  summary: >
      Dans le cadre de l'automatisation des tests d'intrusion, j'ai intégré le laboratoire de sécurité dans le but d'enrichir les outils internes avec de nouveaux tests d'intrusion axés sur la securité des protocoles radio (Wifi, Bluetooth, NFC, Zigbee, etc...) via l'analyse et la mise en oeuvre d'attaques radio contribuant ainsi à la sécurité des produits ( Gateways, Set-top boxe, compteurs connectés, etc)
  highlights:
    - "Tests d'intrusion Wi-Fi (WEP/WPA/WPA3) et Bluetooth (Classic & BLE) sur produits IoT grand public"
    - "Analyse et exploitation de vulnérabilités sur protocoles radio (Wi-Fi, Bluetooth, Zigbee)."
    - "Intégration et automatisation de tests de sécurité dans l’outil interne test-auto (Python)."
    - "Développement de PoC pour les vulnérabilités FragAttack, KRACK et Dragonblood (WPA3)."

