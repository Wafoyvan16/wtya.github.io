- role: "Administrateur cybersécurité"
  company: "ASEI"
  period: "Juin 2026 — présent"
  location: "Toulouse, France"
  summary: >
      Cybersécurité – Programme CARE Renfort RH 
      Dans le cadre du programme CARE Renfort RH Cybersécurité, je contribue au renforcement de la sécurité du système d'information en intervenant sur plusieurs axes stratégiques : la résilience et la sauvegarde des données, la sécurisation des accès à distance, ainsi que la protection et la supervision des postes de travail.
  highlights:
    - "Réalisation concrète n°1"
    - "Réalisation concrète n°2"
    - "Réalisation concrète n°3"
    - "Déploiement et généralisation de l'authentification multifacteur (MFA)."
    - "Réalisation d'audits et de tests de sécurité du système d'information."
